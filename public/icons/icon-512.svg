<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Blueprint Grid lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.35">
    <line x1="64" y1="64" x2="448" y2="64" />
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="64" y1="448" x2="448" y2="448" />

    <line x1="64" y1="64" x2="64" y2="448" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="448" y1="64" x2="448" y2="448" />
  </g>

  <!-- CAD Circuit & Compass Geometry -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Architectural Room Boundary -->
    <rect x="110" y="110" width="292" height="292" rx="24" stroke-dasharray="16 12" />
  </g>

  <!-- Electric Energy Lightning Bolt -->
  <path d="M280 80 L160 270 L250 270 L210 432 L352 230 L262 230 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)" />

  <!-- Node connection dots -->
  <circle cx="110" cy="110" r="16" fill="#6366f1" />
  <circle cx="402" cy="110" r="16" fill="#8b5cf6" />
  <circle cx="110" cy="402" r="16" fill="#38bdf8" />
  <circle cx="402" cy="402" r="16" fill="#10b981" />
</svg>
