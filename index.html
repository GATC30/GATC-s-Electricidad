            },
            upd(t, id, f, v) {
                let o; if(t==='w') o=this.state.walls.find(x=>x.id===id); else if(t==='t') o=this.state.tubes.find(x=>x.id===id); else o=this.state.boxes.find(x=>x.id===id); if(!o) return;
                
                if(f==='lock') o.locked = v;
                else if(f==='n1F') o.n1F = v;
                else if(f==='n2F') o.n2F = v;
                else if(f==='grow') o.grow = v;
                else if(f==='p') o.place = v; else if(f==='dev') { o.device = v||null; if(v && CATALOG[v]) o.z = CATALOG[v].z; }
                else if(f==='lbl') o.label = GATC_ENGINE.sanitizeLabel(v);
                else if(f==='mx') o.mirrorX = v; else if(f==='my') o.mirrorY = v; else if(f==='circ') o.circs = v;
                else if(f==='flip') o.rot = (o.rot + 180) % 360;
                else if(f==='ww') {
                    let newWW = parseFloat(v);
                    if(isNaN(newWW) || newWW < 0.05) return;
                    let oldWW = o.wW || this.state.pConf.wW;
                    let deltaW = newWW - oldWW;
                    o.wW = newWW;
                    
                    const a = Math.atan2(o.y2-o.y1, o.x2-o.x1);
                    const n = { x: -Math.sin(a), y: Math.cos(a) };
                    let dxShift = 0, dyShift = 0;
                    
                    if (o.grow === 'l1') {
                        dxShift = n.x * (deltaW / 2); dyShift = n.y * (deltaW / 2);
                    } else if (o.grow === 'l2') {
                        dxShift = -n.x * (deltaW / 2); dyShift = -n.y * (deltaW / 2);
                    }
                    
                    if (dxShift !== 0 || dyShift !== 0) {
                        o.x1 += dxShift; o.y1 += dyShift; o.x2 += dxShift; o.y2 += dyShift;
                    }
                }
                else {
                    let val = parseFloat(v); if(isNaN(val)) return;
                    if(f==='h') o.heightM=val; else if(f==='z') o.z=val; else if(f==='r') o.rot=val;
                    else if(f==='zh') o.zH=val; 
                    else if(f==='dw') o.dim.w=Math.max(10,(val/100)*this.scale); else if(f==='dh') o.dim.h=Math.max(10,(val/100)*this.scale);
                }
                this.renderProp(); this.render(); this.pushHistory();
            },
            updWallL(id, type, val) {
                let o = this.state.walls.find(x=>x.id===id);
                let V = parseFloat(val);
                if(isNaN(V)) return;

                if (o.locked) {
                    this.toast("La pared está completamente bloqueada. No se puede modificar.");
                    this.renderProp(); return;
                }

                if (o.n1F && o.n2F) {
                    this.toast("Ambos nodos están fijos. No se puede modificar la dimensión.");
                    this.renderProp(); return;
                }

                let poly = this.getWallPolygon(o, this.state.walls, this.scale, this.state.pConf.wW);
                let curL1 = Math.hypot(poly.p2L.x - poly.p1L.x, poly.p2L.y - poly.p1L.y) / this.scale;
                let curL2 = Math.hypot(poly.p2R.x - poly.p1R.x, poly.p2R.y - poly.p1R.y) / this.scale;

                let deltaM = 0;
                if (type === 'l1') deltaM = V - curL1;
                else if (type === 'l2') deltaM = V - curL2;
                
                if (deltaM !== 0) {
                    const p1Connected = this.state.walls.some(cw => cw.lvl === o.lvl && cw.id !== o.id && !cw.detached && (Math.hypot(cw.x1 - o.x1, cw.y1 - o.y1) < 15 || Math.hypot(cw.x2 - o.x1, cw.y2 - o.y1) < 15));
                    const p2Connected = this.state.walls.some(cw => cw.lvl === o.lvl && cw.id !== o.id && !cw.detached && (Math.hypot(cw.x1 - o.x2, cw.y1 - o.y2) < 15 || Math.hypot(cw.x2 - o.x2, cw.y2 - o.y2) < 15));
                    
                    let movingNode = 'p2';
                    if (o.n2F) movingNode = 'p1';
                    else if (o.n1F) movingNode = 'p2';
                    else if (p2Connected && !p1Connected) movingNode = 'p1';
                    
                    o.lengthM += deltaM;
                    const a = Math.atan2(o.y2-o.y1, o.x2-o.x1);
                    
                    if (movingNode === 'p1') {
                        const oldX1 = o.x1, oldY1 = o.y1;
                        o.x1 = o.x2 - Math.cos(a) * o.lengthM * this.scale;
                        o.y1 = o.y2 - Math.sin(a) * o.lengthM * this.scale;
                        
                        const dx = o.x1 - oldX1, dy = o.y1 - oldY1;
                        if (!o.detached) {
                            this.state.walls.forEach(cw => {
                                if (cw.locked || cw.id === o.id || cw.detached) return;
                                if(Math.hypot(cw.x1 - oldX1, cw.y1 - oldY1) < 15) { cw.x1 += dx; cw.y1 += dy; cw.lengthM = Math.hypot(cw.x2 - cw.x1, cw.y2 - cw.y1)/this.scale; }
                                if(Math.hypot(cw.x2 - oldX1, cw.y2 - oldY1) < 15) { cw.x2 += dx; cw.y2 += dy; cw.lengthM = Math.hypot(cw.x2 - cw.x1, cw.y2 - cw.y1)/this.scale; }
                            });
                        }
                    } else {
                        const oldX2 = o.x2, oldY2 = o.y2;
                        o.x2 = o.x1 + Math.cos(a) * o.lengthM * this.scale;
                        o.y2 = o.y1 + Math.sin(a) * o.lengthM * this.scale;
                        
                        const dx = o.x2 - oldX2, dy = o.y2 - oldY2;
                        if (!o.detached) {
                            this.state.walls.forEach(cw => {
                                if (cw.locked || cw.id === o.id || cw.detached) return;
                                if(Math.hypot(cw.x1 - oldX2, cw.y1 - oldY2) < 15) { cw.x1 += dx; cw.y1 += dy; cw.lengthM = Math.hypot(cw.x2 - cw.x1, cw.y2 - cw.y1)/this.scale; }
                                if(Math.hypot(cw.x2 - oldX2, cw.y2 - oldY2) < 15) { cw.x2 += dx; cw.y2 += dy; cw.lengthM = Math.hypot(cw.x2 - cw.x1, cw.y2 - cw.y1)/this.scale; }
                            });
                        }
                    }
                }

                this.renderProp();
                this.render();
                this.pushHistory();
            },
            detachNode(id, n) {
                let o = this.state.walls.find(x=>x.id===id);
                if(!o) return;
                const a = Math.atan2(o.y2-o.y1, o.x2-o.x1);
                if(n === 1) {
                    o.x1 += Math.cos(a) * 20; 
                    o.y1 += Math.sin(a) * 20;
                } else {
                    o.x2 -= Math.cos(a) * 20; 
                    o.y2 -= Math.sin(a) * 20;
                }
                o.lengthM = Math.hypot(o.x2-o.x1, o.y2-o.y1)/this.scale;
                this.renderProp();
                this.render();
                this.pushHistory();
                this.toast(`Nodo ${n} separado exitosamente`);
            },
            
            startMoveEnv() {
                if(!this.state.selectedObj || this.env.selType!=='wall' || this.state.selectedObj.locked) return;
                const sw = this.state.selectedObj, vis = new Set([sw.id]), tmW = [sw], tmB = []; let add = true;
                while(add) { add=false; for(let w of this.state.walls.filter(x=>x.lvl===this.state.lvlId)) { if(vis.has(w.id)||w.locked)continue; let c=false; for(let m of tmW) { if(Math.hypot(w.x1-m.x1,w.y1-m.y1)<2||Math.hypot(w.x1-m.x2,w.y1-m.y2)<2||Math.hypot(w.x1-m.x2,w.y1-m.y1)<2||Math.hypot(w.x2-m.x2,w.y2-m.y2)<2) {c=true;break;} } if(c) {vis.add(w.id); tmW.push(w); add=true;} } }
                this.state.boxes.filter(x=>x.lvl===this.state.lvlId && !x.locked).forEach(b=>{
                    for(let w of tmW) { const l2=Math.pow(w.x2-w.x1,2)+Math.pow(w.y2-w.y1,2); if(l2===0)continue; let t=((b.x-w.x1)*(w.x2-w.x1)+(b.y-w.y1)*(w.y2-w.y1))/l2; t=Math.max(0,Math.min(1,t)); const px=w.x1+t*(w.x2-w.x1), py=w.y1+t*(w.y2-w.y1); if(Math.hypot(b.x-px, b.y-py)<30) { tmB.push(b); break; } }
                });
                this.env.movingEnv = { w: tmW, b: tmB }; this.setTool('move_env'); this.toast('Arrastra el bloque para mover todo');
            },
            removeTubeFromRoute(rId, tId) { 
                if(confirm("¿Seguro que deseas quitar el cable de este tramo?")) { 
                    const r = this.state.routes.find(x=>x.id===rId); 
                    if(r) { 
                        r.tubes = r.tubes.filter(x=>x!==tId); 
                        if(r.tubes.length===0) this.state.routes=this.state.routes.filter(x=>x.id!==rId); 
                        this.renderProp(); this.render(); this.save(); 
                    } 
                } 
            },

            openWireModal(editId) {
                if(editId) {
                    const r = this.state.routes.find(x=>x.id===editId); if(!r) return;
                    this.env.activeRouteId = editId; document.getElementById('wire-circuit-name').value = r.name;
                    this.env.cableRows = JSON.parse(JSON.stringify(r.cables)); document.getElementById('btn-del-route').classList.remove('hidden');
                    if(this.env.editingTubeId) document.getElementById('btn-save-tube').classList.remove('hidden'); else document.getElementById('btn-save-tube').classList.add('hidden');
                } else {
                    this.env.activeRouteId = null; document.getElementById('wire-circuit-name').value = "Cto. " + (this.state.routes.length + 1);
                    this.env.cableRows = [{ type:'AWG', gauge:'12', color:this.state.recentColors[0] }]; document.getElementById('btn-del-route').classList.add('hidden');
                    document.getElementById('btn-save-tube').classList.add('hidden');
                }
                this.env.activeCableRow = this.env.cableRows.length - 1;
                this.renderCableRows();
                this.renderRecentColors();
                document.getElementById('wire-modal').classList.remove('hidden');
            },
            renderRecentColors() {
                let rcHtml = ''; this.state.recentColors.forEach(c => rcHtml += `<div class="color-swatch" style="background:${c}" onclick="app.pickRecentColor('${c}')"></div>`);
                document.getElementById('recent-colors-container').innerHTML = rcHtml; 
            },
            setActiveRow(i) {
                this.env.activeCableRow = i; 
                const rows = document.querySelectorAll('.cable-row-wrapper');
                rows.forEach((r, idx) => {
                    if(idx === i) { r.classList.add('border-indigo-400', 'bg-indigo-50/30'); r.classList.remove('border-slate-200', 'bg-white'); }
                    else { r.classList.remove('border-indigo-400', 'bg-indigo-50/30'); r.classList.add('border-slate-200', 'bg-white'); }
                });
            },
            pickRecentColor(c) {
                if(this.env.cableRows.length>0) {
                    const idx = this.env.activeCableRow !== undefined ? this.env.activeCableRow : this.env.cableRows.length-1;
                    this.env.cableRows[idx].color = c; this.renderCableRows();
                }
            },
            addCableRow() { this.env.cableRows.push({ type:'AWG', gauge:'14', color:this.state.recentColors[1]||'#ff0000' }); this.env.activeCableRow = this.env.cableRows.length-1; this.renderCableRows(); },
            removeCableRow(i) { this.env.cableRows.splice(i, 1); if(this.env.activeCableRow >= this.env.cableRows.length) this.env.activeCableRow = this.env.cableRows.length-1; this.renderCableRows(); },
            updateCableRow(i, f, v) { 
                this.env.cableRows[i][f] = v; 
                if(f==='type') { 
                    const d={'AWG':'12','SPT':'14','TSJ':'3x12','UTP':'Cat5e','Custom':''}; 
                    this.env.cableRows[i].gauge=d[v]||''; 
                } 
                this.renderCableRows(); 
            },
            applyRecColor(c) { this.state.recentColors = this.state.recentColors.filter(x=>x!==c); this.state.recentColors.unshift(c); if(this.state.recentColors.length>8) this.state.recentColors.pop(); this.renderRecentColors(); },
            renderCableRows() {
                const c = document.getElementById('cable-rows-container'); c.innerHTML = '';
                let tsjOpts = ''; for(let h=2; h<=4; h++) { for(let cl=8; cl<=18; cl+=2) tsjOpts+=`<option value="${h}x${cl}">${h}x${cl}</option>`; }
                this.env.cableRows.forEach((r, i) => {
                    let gO = ''; if(r.type==='AWG') gO=`<option>14</option><option>12</option><option>10</option><option>8</option><option>6</option><option>4</option><option>2</option><option>1/0</option><option>2/0</option><option>3/0</option><option>4/0</option>`; else if(r.type==='SPT') gO=`<option>22</option><option>20</option><option>18</option><option>16</option><option>14</option><option>12</option>`; else if(r.type==='TSJ') gO=tsjOpts; else if(r.type==='UTP') gO=`<option>Cat5e</option><option>Cat6</option>`;
                    let gInput = r.type==='Custom' ? `<input type="text" placeholder="Especifique" value="${r.gauge}" class="p-1 border rounded text-xs flex-1 outline-none" onfocus="app.setActiveRow(${i})" onchange="app.updateCableRow(${i},'gauge',this.value)">` : `<select class="p-1 border rounded text-xs flex-1 outline-none" onfocus="app.setActiveRow(${i})" onchange="app.updateCableRow(${i},'gauge',this.value)">${gO.replace(`>${r.gauge}<`, ` selected>${r.gauge}<`)}</select>`;

            init3D() {

                const matP = new THREE.MeshLambertMaterial({color: 0xffffff}); const matB = new THREE.MeshLambertMaterial({color: 0x1e293b});

                const getOY = (l) => (l-1) * this.state.pConf.wH * this.scale;

                this.state.walls.forEach(w => {
                    const l = Math.hypot(w.x1-w.x2, w.y1-w.y2), h = w.heightM*this.scale, oy = getOY(w.lvl);
                    const wt = w.wW ? w.wW*this.scale : this.state.pConf.wW*this.scale;
                    const m = new THREE.Mesh(new THREE.BoxGeometry(l, h, wt), matW);
                    m.position.set((w.x1+w.x2)/2, h/2 + oy, (w.y1+w.y2)/2); m.rotation.y = -Math.atan2(w.y2-w.y1, w.x2-w.x1);
                    m.userData.l = 'civil'; m.visible = this.temp.d3Layers.civil; this.refs.scene.add(m);
                });

                this.state.boxes.forEach(b => {
                    const isA = ['door','window','stairs'].includes(b.type), isE = b.device !== null;
                    const oy = getOY(b.lvl), hB = b.z * this.scale;
                    
                    if(isA) {
                        let m;

                        else if(b.type==='window') { m = new THREE.Mesh(new THREE.BoxGeometry(b.dim.w, 1.2*this.scale, (this.state.pConf.wW*this.scale)+2), matV); m.position.y = hB + 0.6*this.scale + oy; }
                        else if(b.type==='stairs') {
                            m = new THREE.Group(); const sc=10, sh=(b.zH?b.zH*this.scale:2.8*this.scale)/sc, sd=b.dim.h/sc;
                            for(let i=0; i<sc; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(b.dim.w, sh, sd), matW); s.position.set(0, i*sh+sh/2, -b.dim.h/2+i*sd+sd/2); m.add(s); }
                            m.position.y = hB + oy;
                        }
                        if(m) { m.position.x=b.x; m.position.z=b.y; m.rotation.y=-b.rot*Math.PI/180; m.userData.l='civil'; m.visible=this.temp.d3Layers.civil; this.refs.scene.add(m); }
                    } else if(isE) {
                        const m = new THREE.Group(); const sym = CATALOG[b.device].sym;
                        if(sym.includes('S')) { const p=new THREE.Mesh(new THREE.BoxGeometry(8,12,2), matP); const bt=new THREE.Mesh(new THREE.BoxGeometry(2,4,4), matB); bt.position.z=1; m.add(p); m.add(bt); }
                        else if(sym.includes('T')) { const p=new THREE.Mesh(new THREE.BoxGeometry(10,14,2), matP); const bt1=new THREE.Mesh(new THREE.BoxGeometry(2,6,4), matB); bt1.position.set(-2,0,0); const bt2=new THREE.Mesh(new THREE.BoxGeometry(2,6,4), matB); bt2.position.set(2,0,0); m.add(p); m.add(bt1); m.add(bt2); }
                        else if(sym==='L') { const p=new THREE.Mesh(new THREE.CylinderGeometry(8,2,8), matP); const bt=new THREE.Mesh(new THREE.SphereGeometry(5), matP); bt.position.y=-2; m.add(p); m.add(bt); } 
                        else if(sym==='W') { const p=new THREE.Mesh(new THREE.CylinderGeometry(8,8,2), matP); p.rotation.x=Math.PI/2; const bt=new THREE.Mesh(new THREE.SphereGeometry(6), matP); bt.position.z=4; m.add(p); m.add(bt); } 
                        else if(sym==='TV' || sym==='RJ') { const p=new THREE.Mesh(new THREE.BoxGeometry(10,10,2), matP); m.add(p); } 
                        else { const p=new THREE.Mesh(new THREE.BoxGeometry(12,12,2), matP); m.add(p); }
                        m.position.set(b.x, hB + oy, b.y); m.rotation.y=-b.rot*Math.PI/180; m.userData.l='elec'; m.visible=this.temp.d3Layers.elec; this.refs.scene.add(m);
                    }
                });

                this.state.tubes.forEach(t => {
                    const s = this.getB(t.startId), e = this.getB(t.endId);
                    if(s && e && s.lvl===e.lvl) {
                        const oy = getOY(s.lvl), sY = s.z*this.scale+oy, eY = e.z*this.scale+oy; let pts = [];

                        } else {

                            pts.push(new THREE.Vector3(s.x,sY,s.y), new THREE.Vector3(s.x,pY,s.y)); if(t.pts) t.pts.forEach(p => pts.push(new THREE.Vector3(p.x, pY, p.y))); pts.push(new THREE.Vector3(e.x,pY,e.y), new THREE.Vector3(e.x,eY,e.y));

            },

            // --- FASE 3: COTIZACIÓN ---
            renderQuote() {
                const c = document.getElementById('full-content-panel');
                let BOM = {};
                this.state.boxes.forEach(b => { 
                    if (b.device) { const pk = b.device === 'panel' ? `panel_${b.circs||2}` : b.device; BOM[pk] = (BOM[pk] || 0) + 1; } 
                    else if (b.type.startsWith('box_')) {
                        const tMap = { 'box_oct':'tapa_oct', 'box_rect':'tapa_rect', 'box_sq':'tapa_sq' };
                        BOM[tMap[b.type]] = (BOM[tMap[b.type]] || 0) + 1;
                    }
                });

                let wLens = {};
                this.state.routes.forEach(r => {
                    let routeLen = 0;
                    let boxCounts = {};
                    r.tubes.forEach(tid => {
                        const t = this.state.tubes.find(x=>x.id===tid);
                        if(t) {
                            const s=this.getB(t.startId), e=this.getB(t.endId);
                            if(s && e) {
                                // Strictly track actual circuit connections per box
                                boxCounts[s.id] = (boxCounts[s.id] || 0) + 1;
                                boxCounts[e.id] = (boxCounts[e.id] || 0) + 1;
                                let pts = [{x:s.x,y:s.y}, ...(t.pts||[]), {x:e.x,y:e.y}]; 
                                let dist=0; for(let i=0;i<pts.length-1;i++) dist+=Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y)/this.scale;
                                if(t.place==='pared') routeLen += Math.hypot(dist, s.z-e.z);
                                else if(t.place==='techo') routeLen += (this.state.pConf.wH-s.z) + dist + (this.state.pConf.wH-e.z);
                                else if(t.place==='suelo') routeLen += (s.z+0.20) + dist + (e.z+0.20);
                            }
                        }
                    });
                    
                    // Precise Engineering additions
                    let extra = 0;
                    Object.keys(boxCounts).forEach(boxId => {
                        const count = boxCounts[boxId];
                        // If only 1 circuit tube touches it, it's a Terminal Box (+20cm).
                        // If 2 or more, it's a Junction / Pass Box (+10cm flat).
                        extra += count === 1 ? 0.20 : 0.10;
                    });
                    
                    r.cables.forEach(cb => { 
                        const k = `cable_${cb.type}_${cb.gauge}_${cb.color}`; 
                        wLens[k] = (wLens[k] || 0) + (routeLen + extra); 
                    });
                });
                
                // Redondeo estricto al entero superior
                for(let k in wLens) BOM[k] = Math.ceil(wLens[k]);

                let finalBOM = {}; for(let k in BOM) { const cF = this.state.overrides[k] !== undefined ? this.state.overrides[k] : BOM[k]; if(cF > 0) finalBOM[k] = cF; }

                let h = `<div class="max-w-5xl mx-auto pb-20"><div class="flex justify-between items-center mb-6 pt-4"><h2 class="text-xl md:text-3xl font-bold text-slate-800">Presupuesto de Materiales</h2><button onclick="app.addCMat()" class="bg-indigo-100 text-indigo-700 px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-bold shadow-sm hover:bg-indigo-200 transition text-sm whitespace-nowrap">+ Añadir Extra</button></div>
                         <div class="bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden overflow-x-auto">
                         <table class="w-full text-left text-xs md:text-sm"><thead class="bg-slate-50 text-slate-600 border-b"><tr><th class="p-3 md:p-4">Material</th><th class="p-3 md:p-4 text-center">Cant. Calc</th><th class="p-3 md:p-4 text-center">Cant. Final</th><th class="p-3 md:p-4 text-right">P.U(Q)</th><th class="p-3 md:p-4 text-right">Sub(Q)</th></tr></thead><tbody class="divide-y divide-slate-100" id="quote-tbody">`;
                let tQ = 0;

                const getNameHex = (hx) => { const n={'#000000':'N', '#ff0000':'R', '#0000ff':'A', '#ffffff':'B', '#00ff00':'V'}; return n[hx]||'-'; };
                const getL = (k) => {
                    if(k.startsWith('panel_')) return `Tablero Distribución ${k.split('_')[1]} Polos`; if(CATALOG[k]) return CATALOG[k].label; 
                    if(k.startsWith('cable_')) { const p=k.split('_'); return `Cable ${p[1]} Calibre ${p[2]}`; }
                    if(k==='tapa_oct') return 'Tapadera Octagonal (Ciega)'; if(k==='tapa_rect') return 'Tapadera Rectangular (Ciega)'; if(k==='tapa_sq') return 'Tapadera Cuadrada (Ciega)'; return k;
                };

                Object.keys(finalBOM).sort().forEach(k => {
                    const cCalc = Math.ceil(BOM[k]||0), cFin = finalBOM[k]; let pk = k; if(k.startsWith('cable_')) { const p=k.split('_'); pk=`cable_${p[1]}_${p[2]}`; }
                    const pu = this.state.prices[pk] !== undefined ? this.state.prices[pk] : (this.globalPrices[pk] || 0); const sub = cFin*pu; tQ += sub;
                    const u = k.includes('cable') ? 'm' : 'ud';
                    let colBlock = ''; if(k.startsWith('cable_')) { const c = k.split('_')[3]; colBlock = `<span class="inline-flex items-center justify-center w-4 h-4 md:w-5 md:h-5 rounded-full border ml-1 md:ml-2 align-middle text-[8px] md:text-[10px] text-slate-400 font-bold shadow-sm" style="background:${c}">${getNameHex(c)}</span>`; }
                    
                    h += `<tr class="hover:bg-slate-50/80 transition-colors"><td class="p-3 md:p-4 font-medium text-slate-700 max-w-[120px] md:max-w-none truncate" title="${getL(k)}">${getL(k).substring(0,30)}${colBlock}</td><td class="p-3 md:p-4 text-center text-slate-400">${cCalc}${u}</td>
                          <td class="p-3 md:p-4 text-center"><input type="number" class="w-12 md:w-16 border-2 border-indigo-100 p-1 md:p-1.5 rounded-lg text-center font-bold focus:border-indigo-500 outline-none transition shadow-sm" value="${cFin}" onchange="app.state.overrides['${k}']=parseFloat(this.value)||0; app.renderQuote(); app.save();"></td>
                          <td class="p-3 md:p-4 text-right"><span class="text-slate-400 mr-1 md:mr-2 font-medium">Q</span><input type="number" class="w-14 md:w-20 border border-slate-200 p-1 md:p-1.5 rounded-lg text-right bg-slate-50 outline-none focus:border-indigo-400 transition" value="${pu}" onchange="app.state.prices['${pk}']=parseFloat(this.value)||0; app.renderQuote(); app.save();"></td><td class="p-3 md:p-4 font-bold text-slate-800 text-right whitespace-nowrap">Q ${sub.toFixed(2)}</td></tr>`;
                });

                this.state.customMats.forEach((cm, i) => {
                    const sub = cm.qty*cm.price; tQ += sub;
                    h += `<tr class="bg-indigo-50/30 hover:bg-indigo-50/50 transition-colors"><td class="p-3 md:p-4"><input type="text" class="w-full bg-transparent font-medium text-slate-700 outline-none" value="${cm.name}" onchange="app.state.customMats[${i}].name=this.value; app.save();"></td>
                          <td class="p-3 md:p-4 text-center">-</td><td class="p-3 md:p-4 text-center"><input type="number" class="w-12 md:w-16 bg-white border border-slate-200 p-1 md:p-1.5 rounded-lg text-center font-bold outline-none focus:border-indigo-400 shadow-sm" value="${cm.qty}" onchange="app.state.customMats[${i}].qty=parseFloat(this.value)||0; app.renderQuote(); app.save();"></td>
                          <td class="p-3 md:p-4 text-right"><input type="number" class="w-14 md:w-20 bg-white border border-slate-200 p-1 md:p-1.5 rounded-lg text-right outline-none focus:border-indigo-400" value="${cm.price}" onchange="app.state.customMats[${i}].price=parseFloat(this.value)||0; app.renderQuote(); app.save();"></td><td class="p-3 md:p-4 font-bold text-slate-800 text-right flex justify-end gap-2 md:gap-4 items-center whitespace-nowrap">Q ${sub.toFixed(2)} <button onclick="app.state.customMats.splice(${i},1); app.renderQuote(); app.save();" class="text-red-400 hover:text-red-600 hover:bg-red-50 p-1 rounded transition">✕</button></td></tr>`;
                });

                h += `</tbody><tfoot class="bg-slate-800 text-white font-bold text-base md:text-lg"><tr><td colspan="4" class="p-4 md:p-5 text-right tracking-wide">TOTAL PRESUPUESTO ESTIMADO:</td><td class="p-4 md:p-5 text-right text-lg md:text-xl text-indigo-300 whitespace-nowrap">Q ${tQ.toFixed(2)}</td></tr></tfoot></table></div></div>`;
                c.innerHTML = h;
            },
            addCMat() { this.state.customMats.push({name:'Mano de Obra / Extra', qty:1, price:1500}); this.renderQuote(); this.save(); },

                            <div class="bg-gradient-to-br from-slate-700 to-slate-800 p-4 rounded-xl shadow-md text-center text-white"><div class="text-3xl font-black mb-1">${cOther}</div><div class="text-[10px] md:text-xs font-medium text-slate-300 uppercase tracking-wide">Para Otros Accesorios</div></div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-10">
                            <div class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm text-center"><div class="text-xl font-bold text-slate-800">${bOct}</div><div class="text-[10px] text-slate-500 font-medium leading-tight">Octagonales Usadas</div></div>
                            <div class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm text-center"><div class="text-xl font-bold text-slate-800">${cvOct}</div><div class="text-[10px] text-slate-500 font-medium leading-tight">Octagonales Vacías</div></div>
                            <div class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm text-center"><div class="text-xl font-bold text-slate-800">${cvRect}</div><div class="text-[10px] text-slate-500 font-medium leading-tight">Rectangulares Vacías</div></div>
                            <div class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm text-center"><div class="text-xl font-bold text-slate-800">${cvSq}</div><div class="text-[10px] text-slate-500 font-medium leading-tight">Cuadradas Vacías</div></div>
                        </div>
                        <h3 class="text-xl font-bold text-indigo-700 mt-8 mb-4">Circuitos Enrutados a Tableros</h3>
                        <div class="bg-white p-4 md:p-6 rounded-xl border border-slate-200 shadow-sm">
                            ${circList}
                        </div>
                    </div>
                `;
            },

            openExportModal() { document.getElementById('export-modal').classList.remove('hidden'); },

            async executePDF() {
                try {
                    document.getElementById('export-modal').classList.add('hidden');
                    this.toast('Generando PDF de Alta Resolución...');
                    
                    const { jsPDF } = window.jspdf; 
                    const isObra = document.getElementById('pdf-opt-1').checked;
                    const isElec = document.getElementById('pdf-opt-2').checked;
                    const isCoti = document.getElementById('pdf-opt-3').checked;
                    const isMemoria = document.getElementById('pdf-opt-4').checked;
                    const isNomen = document.getElementById('pdf-opt-5').checked;
                    if(!isObra && !isElec && !isCoti && !isMemoria && !isNomen) return this.toast('Selecciona opciones');

                    this.env.isExporting = true;

                    const pNameElem = document.getElementById('current-project-name');
                    let projName = pNameElem && pNameElem.value.trim() !== '' ? pNameElem.value.trim() : "Proyecto";
                    const safeName = projName.replace(/[^a-zA-Z0-9-_\s]/g, '').replace(/\s+/g, '_');
                    const fileName = `${safeName}.pdf`;

                    const doc = new jsPDF({ unit: 'mm', format: 'letter' });
                    let hasPages = false;

                    const addWatermarkAndFooter = (docInst, pw, ph) => {
                        docInst.saveGraphicsState(); docInst.setGState(new docInst.GState({opacity: 0.1}));
                        docInst.setTextColor(150, 150, 150); docInst.setFontSize(60);
                        docInst.text("GATC", pw/2, ph/2 + 20, { angle: 45, align: "center" });
                        docInst.restoreGraphicsState();
                        docInst.setTextColor(150, 150, 150); docInst.setFontSize(8);
                        docInst.text(`Generado por GATC CAD Pro - ${new Date().toLocaleDateString()}`, 20, ph - 15);
                        docInst.text(`Proyecto: ${projName}`, pw - 20, ph - 15, { align: 'right' });
                        docInst.setTextColor(0, 0, 0); 
                    };

                    const renderLvlPh = (lv, pha, title) => {
                        let mx=Infinity, my=Infinity, Mx=-Infinity, My=-Infinity;
                        this.state.walls.filter(x=>x.lvl===lv).forEach(w=>{ mx=Math.min(mx,w.x1,w.x2); Mx=Math.max(Mx,w.x1,w.x2); my=Math.min(my,w.y1,w.y2); My=Math.max(My,w.y1,w.y2); });
                        this.state.boxes.filter(x=>x.lvl===lv).forEach(b=>{ mx=Math.min(mx,b.x); Mx=Math.max(Mx,b.x); my=Math.min(my,b.y); My=Math.max(My,b.y); });
                        if(mx===Infinity) { mx=0; my=0; Mx=800; My=600; }
                        
                        const pad = 20; mx-=pad; my-=pad; Mx+=pad; My+=pad;
                        const bW = Mx-mx, bH = My-my; const orient = bW > bH ? 'l' : 'p'; 
                        const pw = orient === 'l' ? 279.4 : 215.9; const ph = orient === 'l' ? 215.9 : 279.4;
                        
                        const exportScale = 4;
                        const offCv = document.createElement('canvas'); offCv.width = bW * exportScale; offCv.height = bH * exportScale; 
                        const offCtx = offCv.getContext('2d');

                        this.state.lvlId = lv; offCtx.fillStyle = '#ffffff'; offCtx.fillRect(0,0,offCv.width,offCv.height);
                        offCtx.save(); offCtx.scale(exportScale, exportScale); offCtx.translate(-mx, -my); this.render(pha, offCtx); offCtx.restore();
                        
                        if(hasPages) { doc.addPage('letter', orient); } else { doc.deletePage(1); doc.addPage('letter', orient); hasPages=true; }
                        doc.setFontSize(16); doc.setTextColor(0); doc.text(title, 20, 20);
                        
                        const maxW = pw - 40; const maxH = ph - 40; const ratio = Math.min(maxW / bW, maxH / bH);
                        const finalW = bW * ratio; const finalH = bH * ratio; const offX = 20 + (maxW - finalW)/2; const offY = 25 + (maxH - finalH)/2;
                        
                        doc.addImage(offCv.toDataURL("image/jpeg", 0.85), 'JPEG', offX, offY, finalW, finalH);
                        addWatermarkAndFooter(doc, pw, ph);
                    };

                    const origLvl = this.state.lvlId;
                    if(isObra) { this.state.levels.forEach(l => renderLvlPh(l, 1, `Nivel ${l} - Arquitectura`)); }
                    if(isElec) { this.state.levels.forEach(l => renderLvlPh(l, 2, `Nivel ${l} - Eléctrico y Ruteo`)); }
                    this.state.lvlId = origLvl; this.env.isExporting = false; 

                    if(isCoti || isMemoria || isNomen) {
                        const prevPh = this.state.phase; this.setPhase(3);
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            if(isCoti) {
                                if(hasPages) doc.addPage('letter', 'p'); else { doc.deletePage(1); doc.addPage('letter', 'p'); hasPages=true; }
                                doc.setFontSize(16); doc.setTextColor(79, 70, 229); doc.text("Presupuesto de Materiales", 20, 25);
                                let yPos = 40; doc.setFontSize(9); doc.setFillColor(241, 245, 249); doc.rect(20, yPos-5, 175, 8, 'F');
                                doc.setTextColor(0); doc.setFont("helvetica", "bold");
                                doc.text("Material", 22, yPos); doc.text("Cant", 125, yPos); doc.text("P.U(Q)", 150, yPos); doc.text("Sub(Q)", 175, yPos);
                                doc.setFont("helvetica", "normal"); yPos += 8;
                                document.querySelectorAll('#quote-tbody tr').forEach(tr => {
                                    const tds = tr.querySelectorAll('td');
                                    if(tds.length >= 4) {
                                        let mat = tds[0].innerText || tds[0].querySelector('input')?.value; let cant = tds[2].querySelector('input')?.value || tds[2].innerText;
                                        let pu = tds[3].querySelector('input')?.value || tds[3].innerText; let sub = tds[4].innerText.split('✕')[0].trim();
                                        doc.text(mat.substring(0, 50), 22, yPos); doc.text(cant, 125, yPos); doc.text(pu, 150, yPos); doc.text(sub, 175, yPos);
                                        doc.setDrawColor(226, 232, 240); doc.line(20, yPos + 3, 195, yPos + 3); yPos += 9; 
                                        if(yPos > 250) { addWatermarkAndFooter(doc, 215.9, 279.4); doc.addPage('letter', 'p'); doc.setTextColor(0,0,0); yPos=25; }
                                    }
                                });
                                const t = document.querySelector('tfoot td:last-child');
                                const tText = t ? t.innerText : "Q 0.00";
                                doc.setFont("helvetica", "bold"); doc.setTextColor(79, 70, 229); doc.text("TOTAL: " + tText, 135, yPos + 10);
                                addWatermarkAndFooter(doc, 215.9, 279.4);
                            }

                            if(isMemoria) {
                                if(hasPages) doc.addPage('letter', 'p'); else { doc.deletePage(1); doc.addPage('letter', 'p'); hasPages=true; }
                                doc.setFontSize(20); doc.setTextColor(79, 70, 229); doc.text("Memoria Descriptiva", 20, 25);
                                doc.setFontSize(10); doc.setTextColor(100); doc.text("Proyecto: " + projName + " - " + new Date().toLocaleDateString(), 20, 33);
                                doc.setFontSize(12); doc.setTextColor(0); doc.text("1. Condiciones Arquitectónicas:", 20, 50);
                                doc.setFontSize(10); doc.setTextColor(100); doc.text("Ancho Paredes: " + this.state.pConf.wW.toFixed(2) + "m | Altura: " + this.state.pConf.wH.toFixed(2) + "m", 25, 57); doc.text("Altura Ventanas: 1.50m a 2.10m", 25, 63);
                                doc.setFontSize(12); doc.setTextColor(0); doc.text("2. Condiciones Eléctricas:", 20, 80);
                                doc.setFontSize(10); doc.setTextColor(100); doc.text("Cableado: +0.20m en puntas, +0.10m en cajas de paso.", 25, 87); doc.text("Alturas: Toma 0.40m, Apag 1.20m, Tablero 1.75m, Ducha 1.80m.", 25, 93);

                                let bSq=0, bRect=0, bOct=0, cToma=0, cApag=0, cOther=0, cvOct=0, cvRect=0, cvSq=0, tLen=0;
                                this.state.boxes.forEach(b=>{ if(b.device) { if(b.type==='box_oct')bOct++; if(b.device.includes('outlet')) cToma++; else if(b.device.includes('switch')||b.device.includes('mix')) cApag++; else if(b.type!=='box_oct') cOther++; } else if(b.type.startsWith('box_')) { if(b.type==='box_oct')cvOct++; else if(b.type==='box_rect')cvRect++; else if(b.type==='box_sq')cvSq++; } });
                                this.state.tubes.forEach(t=>{ const s=this.getB(t.startId), e=this.getB(t.endId); if(s && e) { let pts = [{x:s.x,y:s.y}, ...(t.pts||[]), {x:e.x,y:e.y}]; let dist=0; for(let i=0;i<pts.length-1;i++) dist+=Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y)/this.scale; if(t.place==='pared') tLen += Math.hypot(dist, s.z-e.z); else if(t.place==='techo') tLen += (this.state.pConf.wH-s.z) + dist + (this.state.pConf.wH-e.z); else if(t.place==='suelo') tLen += (s.z+0.20) + dist + (e.z+0.20); }});

                                doc.setFontSize(12); doc.setTextColor(0); doc.text("3. Resumen Global Obra Civil:", 20, 110);
                                doc.setFontSize(10); doc.setTextColor(100); 
                                doc.text("- Cajas Octagonales Totales: " + bOct, 25, 117); doc.text("- Cajas Rectangulares Totales: " + (bRect+cvRect), 25, 123);
                                doc.text("- Cajas Cuadradas Totales: " + (bSq+cvSq), 25, 129); doc.text("- Tubería Total Calculada: " + tLen.toFixed(1) + "m", 25, 135);

                                doc.setFontSize(12); doc.setTextColor(0); doc.text("4. Circuitos Enrutados a Tablero:", 20, 150); doc.setFontSize(10); doc.setTextColor(100); 
                                
                                this.state.routes = this.state.routes.filter(r => r.tubes && r.tubes.length > 0);
                                let circs = {}; this.state.routes.forEach(r => { 
                                    let toPanel = 'Otros Circuitos (Sin Tablero)'; 
                                    r.tubes.forEach(tid=>{ const t=this.state.tubes.find(x=>x.id===tid); if(t){const s=this.getB(t.startId), e=this.getB(t.endId); if(s&&s.device==='panel') toPanel=s.label||'Tablero Principal'; if(e&&e.device==='panel') toPanel=e.label||'Tablero Principal';} }); 
                                    if(!circs[toPanel])circs[toPanel]=new Set(); circs[toPanel].add(r.name); 
                                });
                                let cY = 157; 
                                Object.keys(circs).forEach(pk=>{ 
                                    doc.setFont("helvetica","bold"); doc.text(pk+":", 25, cY); doc.setFont("helvetica","normal"); cY+=6; 
                                    Array.from(circs[pk]).forEach(rn=>{ doc.text("- "+rn, 30, cY); cY+=5; if(cY > 250) { addWatermarkAndFooter(doc, 215.9, 279.4); doc.addPage('letter', 'p'); doc.setTextColor(100); cY=25; }}); 
                                    cY+=2; 
                                });
                                addWatermarkAndFooter(doc, 215.9, 279.4);
                            }

                            if (isNomen) {
                                if(hasPages) doc.addPage('letter', 'p'); else { doc.deletePage(1); doc.addPage('letter', 'p'); hasPages=true; }
                                doc.setFontSize(18); doc.setTextColor(79, 70, 229); doc.setFont("helvetica", "bold");
                                doc.text("Nomenclatura y Simbología", 20, 25);
                                doc.setFontSize(10); doc.setTextColor(100); doc.setFont("helvetica", "normal");
                                doc.text("Símbolos exactos utilizados en los Planos Eléctricos de este proyecto:", 20, 31);
                                
                                let nomY = 42;
                                let usedDevices = new Set();
                                this.state.boxes.forEach(b => { if(b.device) usedDevices.add(b.device); });
                                
                                doc.setFillColor(241, 245, 249); doc.rect(20, nomY-6, 175, 8, 'F');
                                doc.setFont("helvetica", "bold"); doc.setTextColor(0);
                                doc.text("Símbolo", 25, nomY); doc.text("Descripción del Elemento", 55, nomY);
                                doc.text("Símbolo", 115, nomY); doc.text("Descripción del Elemento", 145, nomY);
                                nomY += 12;

                                const symCv = document.createElement('canvas'); symCv.width = 100; symCv.height = 100; const sCtx = symCv.getContext('2d');
                                const devices = Array.from(usedDevices);
                                for(let i = 0; i < devices.length; i++) {
                                    const col = i % 2; const devKey = devices[i]; const dev = CATALOG[devKey];
                                    if(dev) {
                                        sCtx.clearRect(0,0,100,100); sCtx.save(); sCtx.translate(50, 50); sCtx.scale(2.5, 2.5); 
                                        const s = dev.sym; let yOff = 0; if (s !== 'W' && s !== 'TAB') yOff = -5; sCtx.translate(0, yOff);
                                        let sf = 0.5; if (s.includes('S') || s.includes('M') || s === 'D' || s === 'C' || s === 'B' || s === 'P' || s === 'KWH' || s === 'TV' || s === 'RJ') { sf = 0.85; } else if (s === 'T') { sf = 0.65; }
                                        this.drawSymbol(sCtx, devKey, 0, sf); sCtx.restore();
                                        let curX = col === 0 ? 20 : 110;
                                        doc.addImage(symCv.toDataURL("image/png"), 'PNG', curX + 2, nomY-7, 14, 14);
                                        doc.setFont("helvetica", "bold"); doc.setTextColor(0); doc.setFontSize(10);
                                        let lbl = dev.label; if(lbl.length > 32) lbl = lbl.substring(0, 32) + "...";
                                        doc.text(lbl, curX + 20, nomY + 1);
                                        if (col === 1 || i === devices.length - 1) { doc.setDrawColor(226, 232, 240); doc.line(20, nomY + 8, 195, nomY + 8); nomY += 14; }
                                        if(nomY > 260 && (col === 1 || i === devices.length - 1)) { addWatermarkAndFooter(doc, 215.9, 279.4); doc.addPage('letter', 'p'); doc.setTextColor(0,0,0); nomY = 25; }
                                    }
                                }
                                addWatermarkAndFooter(doc, 215.9, 279.4);
                            }

                            doc.save(fileName);
                            this.setPhase(prevPh); this.toast('PDF Exportado Exitosamente');
                        }));
                    } else {
                        doc.save(fileName); this.toast('PDF Exportado Exitosamente');
                    }
                } catch (e) { alert('Error exportando. ' + e.message); }
            }
        };

        window.app = app;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => app.init());
        } else {
            app.init();
        }
    </script>
</body>
